<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Backrooms 4D - Fixed Version</title>
    <style>
        * { box-sizing: border-box; touch-action: none; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #111;
            font-family: monospace; user-select: none;
        }
        #canvas-container { width: 100vw; height: 100vh; display: block; position: absolute; top: 0; left: 0; }
        #fps-meter {
            position: absolute; top: 15px; right: 20px;
            color: #00ff66; background: rgba(0, 0, 0, 0.8);
            padding: 5px 12px; border: 1px solid #00ff66; font-size: 14px; z-index: 30;
        }
        #hud-title {
            position: absolute; top: 15px; left: 20px;
            color: #f1c40f; font-size: 13px; z-index: 20; font-weight: bold;
        }
        #joystick-zone {
            position: absolute; bottom: 30px; left: 30px;
            width: 140px height: 140px; background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(241, 196, 15, 0.5); border-radius: 50%; z-index: 20;
        }
        #joystick-knob {
            position: absolute; top: 45px; left: 45px; width: 50px; height: 50px;
            background: rgba(241, 196, 15, 0.9); border-radius: 50%; pointer-events: none;
        }
        #btn-action {
            position: absolute; bottom: 40px; right: 40px; width: 95px; height: 95px;
            background: rgba(46, 204, 113, 0.9); border: 3px solid #fff; border-radius: 50%;
            color: #fff; font-weight: bold; font-size: 14px; z-index: 20; display: none;
            align-items: center; justify-content: center; box-shadow: 0 0 20px rgba(46,204,113,0.8);
        }
        #btn-run {
            position: absolute; bottom: 150px; right: 50px; width: 70px; height: 70px;
            background: rgba(231, 76, 60, 0.9); border: 2px solid #fff; border-radius: 50%;
            color: #fff; font-weight: bold; font-size: 13px; z-index: 20; display: flex;
            align-items: center; justify-content: center;
        }
        #crosshair {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 6px; height: 6px; background-color: #fff; border-radius: 50%; z-index: 20;
        }
        #story-box {
            position: absolute; top: 20%; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9); border: 2px solid #f1c40f; color: #fff;
            padding: 15px 25px; font-size: 15px; text-align: center; z-index: 40;
            display: none; border-radius: 5px; max-width: 80%;
        }
        #warning-rotate {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000; z-index: 9999; display: none; align-items: center;
            justify-content: center; color: #f1c40f; font-size: 20px; text-align: center; padding: 20px;
        }
        @media screen and (orientation: portrait) { #warning-rotate { display: flex; } }
    </style>
</head>
<body>

    <div id="warning-rotate">لطفاً گوشی خود را به حالت افقی بچرخانید!</div>
    <div id="crosshair"></div>
    <div id="fps-meter">FPS: 60</div>
    <div id="hud-title">BACKROOMS 4D: SECURE MODE</div>
    <div id="story-box"></div>
    
    <div id="joystick-zone"><div id="joystick-knob"></div></div>
    <div id="btn-run">دویدن</div>
    <div id="btn-action">ورود</div>
    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111);
        scene.fog = new THREE.FogExp2(0x111111, 0.01);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3, 20);

        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        container.appendChild(renderer.domElement);

        // نورپردازی فوق‌العاده قوی برای جلوگیری از صفحه سیاه
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(50, 100, 50);
        scene.add(dirLight);

        // زمین سبز و روشن
        const groundGeo = new THREE.PlaneGeometry(300, 300, 32, 32);
        groundGeo.rotateX(-Math.PI / 2);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x2e7d32, roughness: 0.8 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        scene.add(ground);

        // درِ ورود روی تپه
        const doorGroup = new THREE.Group();
        const frameMesh = new THREE.Mesh(
            new THREE.BoxGeometry(2.4, 3.5, 0.4), 
            new THREE.MeshStandardMaterial({ color: 0x444444 })
        );
        frameMesh.position.y = 1.75;
        doorGroup.add(frameMesh);

        const rotatingDoor = new THREE.Mesh(
            new THREE.BoxGeometry(2.0, 3.2, 0.2), 
            new THREE.MeshStandardMaterial({ color: 0x8d6e63 })
        );
        rotatingDoor.position.set(1.0, 1.6, 0);
        doorGroup.add(rotatingDoor);
        doorGroup.position.set(0, 0, -15);
        scene.add(doorGroup);

        let gameState = 'OUTSIDE';
        const storyBox = document.getElementById('story-box');
        function showMsg(txt, time = 0) {
            storyBox.innerHTML = txt;
            storyBox.style.display = 'block';
            if (time > 0) setTimeout(() => { storyBox.style.display = 'none'; }, time);
        }
        showMsg("به سوی درِ جلو بروید.", 3000);

        // جوی‌استیک کنترلر
        let moveX = 0, moveZ = 0, isRunning = false;
        const joystickZone = document.getElementById('joystick-zone');
        const joystickKnob = document.getElementById('joystick-knob');
        let touchId = null, joyCenter = { x: 0, y: 0 };

        joystickZone.addEventListener('touchstart', (e) => {
            const t = e.changedTouches[0];
            touchId = t.identifier;
            const r = joystickZone.getBoundingClientRect();
            joyCenter.x = r.left + r.width / 2;
            joyCenter.y = r.top + r.height / 2;
        });

        joystickZone.addEventListener('touchmove', (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                const t = e.changedTouches[i];
                if (t.identifier === touchId) {
                    let dx = t.clientX - joyCenter.x;
                    let dy = t.clientY - joyCenter.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const maxD = 45;
                    if (dist > maxD) { dx = (dx / dist) * maxD; dy = (dy / dist) * maxD; }
                    joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
                    moveX = dx / maxD; moveZ = dy / maxD;
                }
            }
        });

        joystickZone.addEventListener('touchend', () => {
            touchId = null;
            joystickKnob.style.transform = `translate(0px, 0px)`;
            moveX = 0; moveZ = 0;
        });

        document.getElementById('btn-run').addEventListener('touchstart', () => { isRunning = true; });
        document.getElementById('btn-run').addEventListener('touchend', () => { isRunning = false; });

        // چرخش دوربین با لمس صفحه
        let prevX = 0, prevY = 0;
        window.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1 && e.touches[0].clientX > window.innerWidth / 3) {
                prevX = e.touches[0].clientX; prevY = e.touches[0].clientY;
            }
        });
        window.addEventListener('touchmove', (e) => {
            if (e.touches.length === 1 && e.touches[0].clientX > window.innerWidth / 3) {
                const dx = e.touches[0].clientX - prevX;
                const dy = e.touches[0].clientY - prevY;
                camera.rotation.y -= dx * 0.003;
                camera.rotation.x -= dy * 0.003;
                camera.rotation.x = Math.max(-0.5, Math.min(0.5, camera.rotation.x));
                prevX = e.touches[0].clientX; prevY = e.touches[0].clientY;
            }
        });

        const btnAction = document.getElementById('btn-action');
        btnAction.addEventListener('click', () => {
            if (gameState === 'OUTSIDE') {
                gameState = 'TRANS';
                let ang = 0;
                const anim = setInterval(() => {
                    ang -= 0.1;
                    rotatingDoor.rotation.y = ang;
                    if (ang <= -1.57) {
                        clearInterval(anim);
                        scene.background = new THREE.Color(0x332200);
                        ground.material.color.set(0x5c4033); // تغییر رنگ زمین به سالن بک‌رومز
                        doorGroup.position.set(0, -100, 0); // حذف در ورودی
                        camera.position.set(0, 3, 10);
                        gameState = 'INSIDE';
                        btnAction.style.display = 'none';
                        showMsg("شما وارد بک‌رومز شدید!", 3000);
                    }
                }, 20);
            }
        });

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const speed = isRunning ? 8.0 : 4.0;

            if (moveZ !== 0 || moveX !== 0) {
                camera.translateZ(moveZ * speed * delta);
                camera.translateX(moveX * speed * delta);
            }

            if (gameState === 'OUTSIDE') {
                if (camera.position.distanceTo(doorGroup.position) < 6.0) {
                    btnAction.style.display = 'flex';
                } else {
                    btnAction.style.display = 'none';
                }
            }

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
