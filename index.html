<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Backrooms - Ultimate 4D Masterpiece Level 6</title>
    <style>
        * { box-sizing: border-box; touch-action: none; }
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', monospace;
            user-select: none;
            -webkit-user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #vhs-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.04), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.04));
            background-size: 100% 3px, 4px 100%;
            z-index: 10;
            opacity: 0.7;
        }
        #vignette {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            box-shadow: inset 0 0 150px rgba(0,0,0,0.95);
            z-index: 11;
        }
        #fps-meter {
            position: absolute;
            top: 15px;
            right: 20px;
            color: #00ff66;
            background: rgba(0, 0, 0, 0.7);
            padding: 5px 10px;
            border: 1px solid #00ff66;
            font-size: 13px;
            z-index: 30;
            border-radius: 4px;
        }
        #hud-title {
            position: absolute;
            top: 15px;
            left: 20px;
            color: #f1c40f;
            font-size: 12px;
            text-shadow: 0 0 5px #000;
            z-index: 20;
            letter-spacing: 1px;
        }
        #joystick-zone {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 130px;
            height: 130px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(241, 196, 15, 0.3);
            border-radius: 50%;
            z-index: 20;
            backdrop-filter: blur(4px);
        }
        #joystick-knob {
            position: absolute;
            top: 40px;
            left: 40px;
            width: 50px;
            height: 50px;
            background: rgba(241, 196, 15, 0.85);
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(241, 196, 15, 0.6);
            pointer-events: none;
        }
        #btn-action {
            position: absolute;
            bottom: 45px;
            right: 40px;
            width: 85px;
            height: 85px;
            background: rgba(46, 204, 113, 0.85);
            border: 2px solid #fff;
            border-radius: 50%;
            color: #fff;
            font-weight: bold;
            font-size: 14px;
            z-index: 20;
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(46, 204, 113, 0.8);
            text-align: center;
        }
        #btn-run {
            position: absolute;
            bottom: 145px;
            right: 45px;
            width: 65px;
            height: 65px;
            background: rgba(231, 76, 60, 0.85);
            border: 2px solid #fff;
            border-radius: 50%;
            color: #fff;
            font-weight: bold;
            font-size: 13px;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #crosshair {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 6px; height: 6px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            z-index: 20;
            pointer-events: none;
            box-shadow: 0 0 6px #fff;
        }
        #story-box {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.88);
            border: 2px solid #f1c40f;
            color: #fff;
            padding: 15px 25px;
            font-size: 16px;
            text-align: center;
            z-index: 40;
            display: none;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(241,196,15,0.4);
            max-width: 80%;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div id="vhs-overlay"></div>
    <div id="vignette"></div>
    <div id="crosshair"></div>
    <div id="fps-meter">FPS: 60</div>
    <div id="hud-title">BACKROOMS: 4D IMMERSIVE REMASTER</div>
    
    <div id="story-box"></div>

    <div id="joystick-zone">
        <div id="joystick-knob"></div>
    </div>
    <div id="btn-run">دویدن</div>
    <div id="btn-action">باز کردن</div>

    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f0d08);
        scene.fog = new THREE.FogExp2(0x0f0d08, 0.03);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.pixelRatio = Math.min(window.devicePixelRatio, 2);
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffcc44, 0.4);
        scene.add(ambientLight);

        function createWallTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#c9a227';
            ctx.fillRect(0, 0, 512, 512);
            for (let i = 0; i < 2000; i++) {
                ctx.fillStyle = Math.random() > 0.5 ? '#7a6114' : '#e2be42';
                ctx.fillRect(Math.random() * 512, Math.random() * 512, 4, 4);
            }
            return new THREE.CanvasTexture(canvas);
        }

        function createCarpetTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#bfa122';
            ctx.fillRect(0, 0, 256, 256);
            for(let i=0; i<3000; i++) {
                ctx.fillStyle = Math.random() > 0.5 ? '#9e8418' : '#d4b32b';
                ctx.fillRect(Math.random()*256, Math.random()*256, 2, 2);
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(15, 15);
            return tex;
        }

        const wallMaterial = new THREE.MeshStandardMaterial({ map: createWallTexture(), roughness: 0.8 });
        const floorMaterial = new THREE.MeshStandardMaterial({ map: createCarpetTexture(), roughness: 0.9 });
        const ceilingMaterial = new THREE.MeshStandardMaterial({ color: 0x1f1d17, roughness: 0.9 });

        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        function initAudio() { if (audioContext.state === 'suspended') audioContext.resume(); }
        window.addEventListener('click', initAudio, { once: true });
        window.addEventListener('touchstart', initAudio, { once: true });

        function playFootstepSound() {
            if (audioContext.state !== 'running') return;
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            const delay = audioContext.createDelay();
            
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(60, audioContext.currentTime);
            osc.frequency.exponentialRampToValueAtTime(20, audioContext.currentTime + 0.15);
            
            gain.gain.setValueAtTime(0.4, audioContext.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.4);
            delay.delayTime.value = 0.25;
            
            osc.connect(gain);
            gain.connect(audioContext.destination);
            gain.connect(delay);
            delay.connect(gain);
            
            osc.start();
            osc.stop(audioContext.currentTime + 0.4);
        }

        let currentLevel = 1;
        let hasKey = false;
        let doorMesh = null;
        let keyMesh = null;

        function buildMaze(level) {
            while(scene.children.length > 2) {
                scene.remove(scene.children[scene.children.length - 1]);
            }

            if (level === 1) {
                const size = 30;
                const floor = new THREE.Mesh(new THREE.PlaneGeometry(size, size), floorMaterial);
                floor.rotation.x = -Math.PI / 2; scene.add(floor);

                const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(size, size), ceilingMaterial);
                ceiling.rotation.x = Math.PI / 2; ceiling.position.y = 3.5; scene.add(ceiling);

                // دیوارهای ساده و بهینه
                const w1 = new THREE.Mesh(new THREE.BoxGeometry(size, 3.5, 0.5), wallMaterial);
                w1.position.set(0, 1.75, -size/2); scene.add(w1);
                const w2 = new THREE.Mesh(new THREE.BoxGeometry(size, 3.5, 0.5), wallMaterial);
                w2.position.set(0, 1.75, size/2); scene.add(w2);
                const w3 = new THREE.Mesh(new THREE.BoxGeometry(0.5, 3.5, size), wallMaterial);
                w3.position.set(-size/2, 1.75, 0); scene.add(w3);
                const w4 = new THREE.Mesh(new THREE.BoxGeometry(0.5, 3.5, size), wallMaterial);
                w4.position.set(size/2, 1.75, 0); scene.add(w4);

                doorMesh = new THREE.Mesh(new THREE.BoxGeometry(1.5, 2.8, 0.2), new THREE.MeshStandardMaterial({color: 0x5c3a21}));
                doorMesh.position.set(0, 1.4, -14.8);
                scene.add(doorMesh);

                camera.position.set(0, 1.6, 10);
            } else if (level === 2) {
                const roomSize = 30;
                const floor = new THREE.Mesh(new THREE.PlaneGeometry(roomSize, roomSize), floorMaterial);
                floor.rotation.x = -Math.PI / 2; scene.add(floor);

                const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(roomSize, roomSize), ceilingMaterial);
                ceiling.rotation.x = Math.PI / 2; ceiling.position.y = 4; scene.add(ceiling);

                doorMesh = new THREE.Mesh(new THREE.BoxGeometry(1.5, 2.8, 0.2), new THREE.MeshStandardMaterial({color: 0x333333}));
                doorMesh.position.set(0, 1.4, 14.8);
                scene.add(doorMesh);

                // کلید
                const keyGeo = new THREE.CylinderGeometry(0.15, 0.15, 0.8, 8);
                keyMesh = new THREE.Mesh(keyGeo, new THREE.MeshStandardMaterial({color: 0xffd700, metalness: 0.9}));
                keyMesh.rotation.z = Math.PI / 2;
                keyMesh.position.set(8, 0.5, -8);
                scene.add(keyMesh);

                camera.position.set(0, 1.6, 12);
            } else if (level === 3) {
                scene.background = new THREE.Color(0xffffff);
                scene.fog = new THREE.FogExp2(0xffffff, 0.01);
                ambientLight.color.set(0xffffff);
                ambientLight.intensity = 1.0;
                
                const endFloor = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.MeshBasicMaterial({color: 0xffffff}));
                endFloor.rotation.x = -Math.PI/2; scene.add(endFloor);
                camera.position.set(0, 1.6, 0);
            }
        }

        buildMaze(1);

        const storyBox = document.getElementById('story-box');
        function showStoryMessage(text, duration = 0) {
            storyBox.innerHTML = text;
            storyBox.style.display = 'block';
            if (duration > 0) {
                setTimeout(() => { storyBox.style.display = 'none'; }, duration);
            }
        }

        let moveX = 0, moveZ = 0, isRunning = false;
        const joystickZone = document.getElementById('joystick-zone');
        const joystickKnob = document.getElementById('joystick-knob');
        let touchId = null, joyCenter = { x: 0, y: 0 };

        joystickZone.addEventListener('touchstart', (e) => {
            const touch = e.changedTouches[0];
            touchId = touch.identifier;
            const rect = joystickZone.getBoundingClientRect();
            joyCenter.x = rect.left + rect.width / 2;
            joyCenter.y = rect.top + rect.height / 2;
        });

        joystickZone.addEventListener('touchmove', (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                if (touch.identifier === touchId) {
                    let dx = touch.clientX - joyCenter.x;
                    let dy = touch.clientY - joyCenter.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const maxDist = 45;
                    if (dist > maxDist) { dx = (dx / dist) * maxDist; dy = (dy / dist) * maxDist; }
                    joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
                    moveX = dx / maxDist; moveZ = dy / maxDist;
                }
            }
        });

        joystickZone.addEventListener('touchend', (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === touchId) {
                    touchId = null;
                    joystickKnob.style.transform = `translate(0px, 0px)`;
                    moveX = 0; moveZ = 0;
                }
            }
        });

        const btnRun = document.getElementById('btn-run');
        btnRun.addEventListener('touchstart', () => { isRunning = true; btnRun.style.background = '#e74c3c'; });
        btnRun.addEventListener('touchend', () => { isRunning = false; btnRun.style.background = 'rgba(231, 76, 60, 0.85)'; });

        let prevTouchX = 0, prevTouchY = 0;
        window.addEventListener('touchstart', (e) => {
            if(e.touches.length === 1 && e.touches[0].clientX > window.innerWidth / 3) {
                prevTouchX = e.touches[0].clientX; prevTouchY = e.touches[0].clientY;
            }
        });

        window.addEventListener('touchmove', (e) => {
            if(e.touches.length === 1 && e.touches[0].clientX > window.innerWidth / 3) {
                const dx = e.touches[0].clientX - prevTouchX;
                const dy = e.touches[0].clientY - prevTouchY;
                camera.rotation.y -= dx * 0.003;
                camera.rotation.x -= dy * 0.003;
                camera.rotation.x = Math.max(-0.6, Math.min(0.6, camera.rotation.x));
                prevTouchX = e.touches[0].clientX; prevTouchY = e.touches[0].clientY;
            }
        });

        const btnAction = document.getElementById('btn-action');
        let actionType = null;

        btnAction.addEventListener('click', () => {
            if (currentLevel === 1 && actionType === 'door') {
                currentLevel = 2; buildMaze(2);
                btnAction.style.display = 'none';
                showStoryMessage("تبریک می‌گویم شما وارد مرحله جدید شدید", 4000);
            } else if (currentLevel === 2 && actionType === 'key') {
                hasKey = true; scene.remove(keyMesh);
                keyMesh = null; btnAction.style.display = 'none';
                showStoryMessage("کلید برداشته شد! حالا به سمت در برگردید.", 3000);
            } else if (currentLevel === 2 && actionType === 'exitDoor') {
                if (hasKey) {
                    currentLevel = 3; buildMaze(3);
                    btnAction.style.display = 'none';
                    playFootstepSound();
                    showStoryMessage("ممنون که بازی رو بازی کردی!", 0);
                } else {
                    showStoryMessage("برای باز کردن در به کلید نیاز دارید!", 2500);
                }
            }
        });

        let lastTime = performance.now(), frameCount = 0;
        const fpsMeter = document.getElementById('fps-meter');
        const clock = new THREE.Clock();
        let stepTimer = 0;

        function animate() {
            requestAnimationFrame(animate);
            const now = performance.now();
            frameCount++;
            if (now - lastTime >= 1000) {
                fpsMeter.innerHTML = "FPS: " + frameCount;
                frameCount = 0; lastTime = now;
            }

            const delta = clock.getDelta();
            const speed = isRunning ? 6.0 : 3.0;

            if (moveZ !== 0 || moveX !== 0) {
                camera.translateZ(moveZ * speed * delta);
                camera.translateX(moveX * speed * delta);
                camera.position.y = 1.6;

                stepTimer += delta * (isRunning ? 6 : 3.5);
                if (stepTimer > 1.2) { playFootstepSound(); stepTimer = 0; }
            }

            if (doorMesh) {
                const dist = camera.position.distanceTo(doorMesh.position);
                if (dist < 3.0) {
                    btnAction.style.display = 'flex';
                    if (currentLevel === 1) { actionType = 'door'; btnAction.innerHTML = 'باز کردن در'; }
                    else if (currentLevel === 2) { actionType = 'exitDoor'; btnAction.innerHTML = 'باز کردن در'; }
                } else if (!keyMesh || camera.position.distanceTo(keyMesh.position) >= 2.5) {
                    btnAction.style.display = 'none';
                }
            }

            if (keyMesh) {
                const distKey = camera.position.distanceTo(keyMesh.position);
                if (distKey < 2.5) {
                    btnAction.style.display = 'flex';
                    actionType = 'key';
                    btnAction.innerHTML = 'برداشتن کلید';
                }
            }

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
